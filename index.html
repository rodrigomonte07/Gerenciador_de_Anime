<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Animes</title>
    <link rel="shortcut icon" href="Gemini_Generated_Image.ico" type="image/x-icon">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <img src="./Gemini_Generated_Image.png" alt="logo">
        <div class="busca-container">
            <input type="text" id="pesquisa" placeholder="Pesquisar anime...">
        </div>
    </header>

    <main class="principal">

        <div class="caixa">
            <form id="formulario" class="formulario">
                <label for="titulo">Titulo</label>
                <input type="text" id="titulo" name="titulo" placeholder="Título do Anime" required>
                <br>
                <label for="genero">Gênero</label>
                <input type="text" name="genero" id="genero" placeholder="Ex: Ação, Aventura, Suspense..." required>
                <br>
                <label for="protagonista">Protagonista</label>
                <input type="text" name="protagonista" id="protagonista" placeholder=" Nome do Protagonista" required>
                <br>
                <label for="foto">Link da foto</label>
                <input type="link" name="foto" id="foto" placeholder="Cole o link da URL da foto" required>
                <br>
                <button>Cadastrar</button>
            </form>
        </div>

        <section id="container" class="container"></section>

    </main>

    <footer class="rodape">
    <p>© 2026 Anime Catalog • Desenvolvido por Rodrigo Monte</p>
</footer>

    <script src="./script.js"></script>   
</body>
</html>
